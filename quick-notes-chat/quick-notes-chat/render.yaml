services:
  - type: web
    name: quick-notes-chat
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: quick-notes-chat-db
          property: connectionString

databases:
  - name: quick-notes-chat-db
    plan: free
